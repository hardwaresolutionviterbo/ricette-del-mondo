name: Prepara progetto Flutter V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Controlla ZIP V4
        run: |
          test -f RicetteDelMondo_V4_DEFINITIVA_CORRETTA.zip
          echo "ZIP V4 trovato correttamente"

      - name: Pulisce il vecchio progetto Flutter
        run: |
          rm -rf assets
          rm -rf lib
          rm -rf android
          rm -rf ios
          rm -rf web
          rm -rf linux
          rm -rf macos
          rm -rf windows
          rm -f pubspec.yaml
          rm -f pubspec.lock
          rm -f analysis_options.yaml
          rm -f README.md
          rm -f codemagic.yaml

      - name: Estrae la V4 definitiva
        run: |
          rm -rf /tmp/rdm_v4
          mkdir -p /tmp/rdm_v4
          unzip -q RicetteDelMondo_V4_DEFINITIVA_CORRETTA.zip -d /tmp/rdm_v4
          cp -a /tmp/rdm_v4/. .
          rm -f RicetteDelMondo_V4_DEFINITIVA_CORRETTA.zip

      - name: Controlla che sia davvero V4
        run: |
          grep -q "Cosa hai nel frigo?" lib/main.dart
          grep -q "FridgePage" lib/main.dart
          grep -q "history" assets/recipes.json
          grep -q "estimatedCost" assets/recipes.json
          echo "V4 verificata correttamente"

      - name: Crea configurazione Codemagic
        run: |
          cat > codemagic.yaml <<'EOF'
          workflows:
            android-build:
              name: Ricette del Mondo Android
              max_build_duration: 60
              instance_type: mac_mini_m2
              environment:
                flutter: stable
              scripts:
                - name: Genera progetto Android
                  script: flutter create --platforms=android .
                - name: Installa pacchetti
                  script: flutter pub get
                - name: Crea APK
                  script: flutter build apk --debug
              artifacts:
                - build/app/outputs/flutter-apk/*.apk
          EOF

      - name: Salva la V4 nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepara progetto Flutter V4 definitiva" || echo "Nessuna modifica da salvare"
          git push
