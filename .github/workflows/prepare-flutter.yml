name: Prepara progetto Flutter V4

on:
  push:
    paths:
      - 'RicetteDelMondo_Flutter_v4_completo.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Pulisce il vecchio progetto Flutter
        run: |
          rm -rf assets
          rm -rf lib
          rm -rf android
          rm -rf ios
          rm -rf web
          rm -rf linux
          rm -rf macos
          rm -rf windows
          rm -f pubspec.yaml
          rm -f pubspec.lock
          rm -f analysis_options.yaml
          rm -f README.md
          rm -f codemagic.yaml

      - name: Estrai la V4
        run: |
          unzip -o RicetteDelMondo_Flutter_v4_completo.zip
          rm RicetteDelMondo_Flutter_v4_completo.zip

      - name: Crea configurazione Codemagic
        run: |
          cat > codemagic.yaml <<'EOF'
          workflows:
            android-build:
              name: Ricette del Mondo Android
              max_build_duration: 60
              instance_type: mac_mini_m2
              environment:
                flutter: stable
              scripts:
                - name: Genera progetto Android
                  script: flutter create --platforms=android .
                - name: Installa pacchetti
                  script: flutter pub get
                - name: Crea APK
                  script: flutter build apk --debug
              artifacts:
                - build/app/outputs/flutter-apk/*.apk
          EOF

      - name: Salva i file preparati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepara progetto Flutter V4 pulito" || echo "Nessuna modifica da salvare"
          git push
