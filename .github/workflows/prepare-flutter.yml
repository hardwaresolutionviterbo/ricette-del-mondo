name: Prepara progetto Flutter V3

on:
  push:
    paths:
      - 'RicetteDelMondo_Flutter_v3_reale.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai la V3
        run: |
          unzip -o RicetteDelMondo_Flutter_v3_reale.zip
          rm RicetteDelMondo_Flutter_v3_reale.zip

      - name: Rimuovi eventuali file vecchi non più presenti
        run: |
          git status --short

      - name: Salva la V3 nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aggiorna progetto alla V3"
          git push
