name: Applica Ricette del Mondo V5.1

on:
  push:
    paths:
      - 'RicetteDelMondo_V5_1_Speciali_Cotture.7z'
      - '.github/workflows/apply-v51.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installa 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Applica V5.1
        run: |
          test -f RicetteDelMondo_V5_1_Speciali_Cotture.7z
          7z x -y RicetteDelMondo_V5_1_Speciali_Cotture.7z
          rm -f RicetteDelMondo_V5_1_Speciali_Cotture.7z

      - name: Salva le modifiche nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da applicare."
            exit 0
          fi
          git commit -m "Applica Ricette del Mondo V5.1"
          git push
