name: ricette_del_mondo
description: Ricette del Mondo — app di ricette e viaggio con catalogo locale da 120 ricette.
publish_to: "none"
version: 5.1.0+6
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_rdm.png
    - assets/recipes.json
    - assets/images/
