workflows:
  android-build:
    name: Ricette del Mondo Android debug
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create Android platform files
        script: flutter create --platforms=android .
      - name: Set visible Android app name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Ricette del Mondo"', s, count=1)
          p.write_text(s)
          PY
      - name: Generate app launcher icon
        script: dart run flutter_launcher_icons
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
