workflows:
  android-build:
    name: Ricette del Mondo Android release
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Create Android platform files
        script: flutter create --platforms=android .
      - name: Set visible Android app name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Ricette del Mondo"', s)
          manifest.write_text(s)
          PY
      - name: Generate app launcher icon
        script: dart run flutter_launcher_icons
      - name: Clean previous build artifacts
        script: flutter clean
      - name: Get packages after clean
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
