workflows:
  android-build:
    name: Ricette del Mondo Android release
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Create Android platform files
        script: flutter create --platforms=android .

      - name: Configure Firebase Android
        script: |
          set -e

          test -f google-services.json
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                  '    id("com.google.firebase.crashlytics") version "3.0.6" apply false\n',
                  1
              )
          elif 'com.google.firebase.crashlytics' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.firebase.crashlytics") version "3.0.6" apply false\n',
                  1
              )

          settings.write_text(s)

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          if 'com.google.gms.google-services' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.gms.google-services")\n'
                  '    id("com.google.firebase.crashlytics")\n',
                  1
              )
          elif 'com.google.firebase.crashlytics' not in s:
              s = s.replace(
                  'plugins {\n',
                  'plugins {\n'
                  '    id("com.google.firebase.crashlytics")\n',
                  1
              )

          app.write_text(s)
          PY

      - name: Configure Android app
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = re.sub(
              r'android:label="[^"]*"',
              'android:label="Ricette del Mondo"',
              s,
              count=1
          )

          if 'android.permission.INTERNET' not in s:
              s = re.sub(
                  r'(<manifest[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                  s,
                  count=1
              )

          p.write_text(s)
          PY

      - name: Generate app launcher icon
        script: dart run flutter_launcher_icons

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
