workflows:
  android-build:
    name: Ricette del Mondo Android release
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze Flutter project
        script: flutter analyze
      - name: Create Android platform files
        script: |
          set -e
          flutter create --platforms=android --org it.ricettedelmondo .
          python3 - <<'PY'
          from pathlib import Path
          import re
          app = Path("android/app/build.gradle.kts")
          s = app.read_text()
          s = re.sub(r'applicationId = "[^"]*"', 'applicationId = "it.ricettedelmondo.app"', s, count=1)
          app.write_text(s)
          PY
      - name: Configure Firebase Android
        script: |
          set -e
          test -f google-services.json
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          if 'com.google.gms.google-services' not in s:
              marker = 'plugins {\n'
              addition = '    id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.google.firebase.crashlytics") version "3.0.6" apply false\n'
              if marker in s:
                  s = s.replace(marker, marker + addition, 1)
              else:
                  raise SystemExit("Impossibile trovare il blocco plugins in android/settings.gradle.kts")
          elif 'com.google.firebase.crashlytics' not in s:
              marker = 'plugins {\n'
              s = s.replace(marker, marker + '    id("com.google.firebase.crashlytics") version "3.0.6" apply false\n', 1)
          settings.write_text(s)

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()
          if 'com.google.gms.google-services' not in s:
              marker = 'plugins {\n'
              s = s.replace(marker, marker + '    id("com.google.gms.google-services")\n    id("com.google.firebase.crashlytics")\n', 1)
          elif 'com.google.firebase.crashlytics' not in s:
              marker = 'plugins {\n'
              s = s.replace(marker, marker + '    id("com.google.firebase.crashlytics")\n', 1)
          if 'isCoreLibraryDesugaringEnabled' not in s:
              marker = '    compileOptions {\n'
              if marker in s:
                  s = s.replace(marker, marker + '        isCoreLibraryDesugaringEnabled = true\n', 1)
              else:
                  raise SystemExit("Impossibile trovare compileOptions in android/app/build.gradle.kts")

          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              if 'dependencies {' in s:
                  s = s.replace(
                      'dependencies {\n',
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n',
                      1
                  )
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          app.write_text(s)
          PY
      - name: Set Android app name and network access
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Ricette del Mondo"', s, count=1)
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          if 'com.google.firebase.messaging.default_notification_channel_id' not in s:
              s = s.replace(
                  '</application>',
                  '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="@string/rdm_notification_channel_id" />\n    </application>',
                  1
              )
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace(
                  '</application>',
                  '        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3671849539323271~6951329765" />\n    </application>',
                  1
              )
          p.write_text(s)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          channel_strings = values / "rdm_notifications.xml"
          channel_strings.write_text(
              '<resources>\n'
              '    <string name="rdm_notification_channel_id">rdm_general</string>\n'
              '</resources>\n'
          )
          PY
      - name: Generate app launcher icon
        script: dart run flutter_launcher_icons
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
